[package]
name = "tree-sitter-r"
version = "1.2.0"
edition = "2021"
license = "MIT"
# Patched: parser.c + scanner.c pre-compiled to lib/libtree_sitter_r.a for wasm32-wasip2.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_r"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
